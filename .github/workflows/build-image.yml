name: Build reference image

on:
  push:
    branches: [main]
    paths:
      - 'image_b64/**'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild JPEG from verified chunks
        shell: bash
        run: |
          cat image_b64/p*.txt | tr -d '\r\n' | base64 --decode > weather_consensus_reference.jpg
          test -s weather_consensus_reference.jpg
          file weather_consensus_reference.jpg
          sha256sum weather_consensus_reference.jpg
          wc -c weather_consensus_reference.jpg

      - name: Commit generated image
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather_consensus_reference.jpg
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Rebuild Weather Consensus reference image'
            git push
          fi
